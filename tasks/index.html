<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>AI 태스크 매니저</title>
    <link rel="icon" href="../assets/img/favicon.ico">
    <link rel="stylesheet" href="css/tasks.css">
</head>
<body>
    <div id="app">
        <div class="loading-init">
            <div class="spinner"></div>
            <p>로딩 중...</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" data-view="dump" onclick="App.navigate('dump')">
            <span class="nav-icon">✏️</span>
            <span class="nav-label">입력</span>
        </div>
        <div class="nav-item" data-view="today" onclick="App.navigate('today')">
            <span class="nav-icon">📋</span>
            <span class="nav-label">오늘</span>
        </div>
        <div class="nav-item" data-view="projects" onclick="App.navigate('projects')">
            <span class="nav-icon">🗂️</span>
            <span class="nav-label">프로젝트</span>
        </div>
        <div class="nav-item" data-view="settings" onclick="App.navigate('settings')">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">설정</span>
        </div>
    </nav>

    <script src="js/store.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
